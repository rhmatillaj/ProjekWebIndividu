<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TasKuy - My Tasks</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Sidebar -->
    <nav class="sidebar">

        <div class="logo">
            TasKuy
        </div>

        <ul class="nav-menu">

            <li>
                <a href="index.html">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="tasks.html" class="active">
                    My Tasks
                </a>
            </li>

            <li>
                <a href="schedule.html">
                    Schedule
                </a>
            </li>

        </ul>

    </nav>
    
    <!-- Main Content -->
    <main class="main-content">

        <!-- Header -->
        <header class="top-header">

            <div>
                <h1>My Tasks</h1>

                <p>
                    Kelola semua tugas kuliah kamu
                </p>
            </div>

            <button
                class="primary-button"
                id="addTaskButton"
            >
                + Tambah Tugas
            </button>

        </header>

        <!-- Statistics -->
        <section class="stats-section">

            <article class="stat-card">

                <h3>Total Tugas</h3>

                <p id="taskTotal">
                    0
                </p>

            </article>


            <article class="stat-card">

                <h3>Selesai</h3>

                <p id="taskCompleted">
                    0
                </p>

            </article>


            <article class="stat-card">

                <h3>Belum Selesai</h3>

                <p id="taskPending">
                    0
                </p>

            </article>


            <article class="stat-card">

                <h3>Terlambat</h3>

                <p id="taskOverdue">
                    0
                </p>

            </article>

        </section>
