<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TasKuy - Schedule</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- SIDEBAR -->
    <nav class="sidebar">

        <div class="logo">
            TasKuy
        </div>

        <ul class="nav-menu">

            <li>
                <a href="index.html">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="tasks.html">
                    My Tasks
                </a>
            </li>

            <li>
                <a href="schedule.html" class="active">
                    Schedule
                </a>
            </li>

        </ul>

    </nav>

    <!-- MAIN -->
    <main class="main-content">
        

        <!-- HEADER -->
        <header class="top-header">

            <div>
                <h1>Schedule</h1>

                <p>
                    Atur jadwal kuliah dan kegiatanmu
                </p>
            </div>

            <button
                class="primary-button"
                id="addScheduleButton"
            >
                + Tambah Jadwal
            </button>

        </header>

         <!-- WEEK -->
        <section class="week-navigation">

            <div>
                <h2 id="weekTitle">
                    Jadwal Mingguan
                </h2>

                <p id="weekSubtitle">
                    Jadwal kuliah dan kegiatan
                </p>
            </div>

        </section>


        <!-- WEEKLY SCHEDULE -->
        <section class="schedule-card">

            <div class="calendar-grid">

                <!-- SENIN -->
                <article class="day-column">

                    <div class="day-header">
                        <h3>Senin</h3>
                    </div>

                    <div
                        class="schedule-list"
                        id="mondaySchedule"
                    ></div>

                </article>


                <!-- SELASA -->
                <article class="day-column">

                    <div class="day-header">
                        <h3>Selasa</h3>
                    </div>

                    <div
                        class="schedule-list"
                        id="tuesdaySchedule"
                    ></div>

                </article>


                <!-- RABU -->
                <article class="day-column">

                    <div class="day-header">
                        <h3>Rabu</h3>
                    </div>

                    <div
                        class="schedule-list"
                        id="wednesdaySchedule"
                    ></div>

                </article>


                <!-- KAMIS -->
                <article class="day-column">

                    <div class="day-header">
                        <h3>Kamis</h3>
                    </div>

                    <div
                        class="schedule-list"
                        id="thursdaySchedule"
                    ></div>

                </article>


                <!-- JUMAT -->
                <article class="day-column">

                    <div class="day-header">
                        <h3>Jumat</h3>
                    </div>

                    <div
                        class="schedule-list"
                        id="fridaySchedule"
                    ></div>

                </article>

                <!-- SABTU -->
                <article class="day-column">
                    <div class="day-header">
                        <h3>Sabtu</h3>
                    </div>

                    <div
                        class="schedule-list"
                        id="saturdaySchedule"
                    ></div>
                </article>

                <!-- MINGGU -->
                <article class="day-column">
                    <div class="day-header">
                        <h3>Minggu</h3>
                    </div>

                    <div
                        class="schedule-list"
                        id="sundaySchedule"
                    ></div>
                </article>

            </div>

        </section>

        <!-- TODAY -->
        <section class="dashboard-card today-schedule-card">

            <div class="card-header">

                <div>
                    <h2>Jadwal Hari Ini</h2>

                    <p>
                        Kegiatan yang berlangsung hari ini
                    </p>
                </div>

            </div>

            <div id="todayScheduleDetail">

                <!-- JavaScript -->

            </div>

        </section>

    </main>

        <!-- MODAL -->
    <div
        class="modal"
        id="scheduleModal"
        aria-hidden="true"
    >

        <div class="modal-content">

            <div class="modal-header">

                <div>

                    <h2 id="scheduleModalTitle">
                        Tambah Jadwal
                    </h2>

                    <p>
                        Masukkan informasi jadwal
                    </p>

                </div>

                <button
                    type="button"
                    class="close-button"
                    id="closeScheduleModal"
                    aria-label="Tutup"
                >
                    ×
                </button>

            </div>


            <form id="scheduleForm">

                <div class="form-group">

                    <label for="scheduleCourse">
                        Nama Kegiatan / Mata Kuliah
                    </label>

                    <input
                        type="text"
                        id="scheduleCourse"
                        placeholder="Contoh: Pemrograman Web"
                        
                    >

                </div>


                <div class="form-group">

                    <label for="scheduleDay">
                        Hari
                    </label>

                    <select
                        id="scheduleDay"
                        
                    >

                        <option value="">
                            Pilih Hari
                        </option>

                        <option value="Senin">
                            Senin
                        </option>

                        <option value="Selasa">
                            Selasa
                        </option>

                        <option value="Rabu">
                            Rabu
                        </option>

                        <option value="Kamis">
                            Kamis
                        </option>

                        <option value="Jumat">
                            Jumat
                        </option>
                        <option value="Sabtu">
                            Sabtu
                        </option>
                        <option value="Minggu">
                            Minggu
                        </option>

                    </select>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="scheduleStart">
                            Mulai
                        </label>

                        <input
                            type="time"
                            id="scheduleStart"
                            
                        >

                    </div>


                    <div class="form-group">

                        <label for="scheduleEnd">
                            Selesai
                        </label>

                        <input
                            type="time"
                            id="scheduleEnd"
                            
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="scheduleRoom">
                        Ruangan / Lokasi
                    </label>

                    <input
                        type="text"
                        id="scheduleRoom"
                        placeholder="Contoh: Lab Komputer"
                    >

                </div>


                <div class="modal-actions">

                    <button
                        type="button"
                        class="secondary-button"
                        id="cancelScheduleButton"
                    >
                        Batal
                    </button>

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Simpan Jadwal
                    </button>

                </div>

            </form>

        </div>

    </div>
