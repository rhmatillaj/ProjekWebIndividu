<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TasKuy - Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="logo">
            TasKuy
        </div>

        <ul class="nav-menu">

            <li>
                <a href="index.html" class="active">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="tasks.html">
                    My Tasks
                </a>
            </li>

            <li>
                <a href="schedule.html">
                    Schedule
                </a>
            </li>

        </ul>

    </nav>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Header -->
        <header class="top-header">

            <div>
                <h1>Dashboard</h1>
                <p>Selamat datang kembali di TasKuy 👋</p>
            </div>

            <div class="user-profile">
                <span>Mahasiswa</span>
            </div>

        </header>

                <!-- Statistics -->
        <section class="stats-section">

            <article class="stat-card">
                <h3>Total Tugas</h3>
                <p id="totalTasks">0</p>
            </article>

            <article class="stat-card">
                <h3>Selesai</h3>
                <p id="completedTasks">0</p>
            </article>

            <article class="stat-card">
                <h3>Belum Selesai</h3>
                <p id="pendingTasks">0</p>
            </article>

            <article class="stat-card">
                <h3>Progress</h3>
                <p id="taskProgress">0%</p>
            </article>

        </section>
